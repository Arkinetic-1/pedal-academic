    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
    <!--Header-->
    <div class="container-fluid">
        <div class="row py-1 bg-head shadow textshad" style="height: 67px;">
            <nav class="navbar navbar-expand-sm bg-head shadow textshad rounded-4 d-flex">
                <div class="container-fluid">
                    <a class="navbar-brand orb text-white" href="https://arkinetic-1.github.io/index.html"
                        style="font-size: 30px;font-weight: bold;  ">
                        <img src="Assets/img/logo.svg" alt="Logo" class="image-fluid">&nbsp;
                        Arkinetic
                    </a>
                    <button class="navbar-toggler bg-white" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                        aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarNav">
                        <ul class="navbar-nav">
                            <li class="nav-item text-end orb">
                                <a class="nav-link text-light" href="https://arkinetic-1.github.io/academic.html">
                                    <h5>Academic</h5>
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </div>
    </div>


    <!--Body-->
    <div class="container-fluid mt-4 p-3">
        <h1 class="text-center textshad zen mt-1">The M.S.G. Database</h1>
        <div class="row p-1">

            <div class="col-12 d-flex justify-content-between align-items-center">
               <div class="d-flex flex-row"> <!--  onclick="fetchGhibli()" -->
                    <input type="text" class="form-control rounded-start-pill" placeholder="Enter Ghibli Movie Title" id="GhiblisearchInput">
                    <div class="btn rounded-end-pill text-white aud btn-primary">Search</div>
                </div>

                <div class="p-1">
                    <ul class="pagination">
                        <li class="page-item aud"><a class="page-link btn" onclick="prev()">Previous</a></li>
                        <li class="page-item aud"><a class="page-link btn" id="currentpage">1</a></li>
                        <li class="page-item aud"><a class="page-link btn" onclick="next()">Next</a></li>
                    </ul>
                </div>
            </div>

            <div class="col-12 mt-3 gy-2" id="parent">

            </div>

        </div>

    </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>
        //Init Elements
        var elCurrentPage = document.getElementById("currentpage");
        var elParent = document.getElementById("parent");
        var elSearch = document.getElementById("GhiblisearchInput")

        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        var page = urlParams.get('page');
        if (page == null) {
            page = 1;
        } else {
            page = parseInt(page);
        }

        //Pagination Variables
        var lastGhibli = 21
        var perPage = 7
        var finalPage = Math.ceil(lastGhibli / perPage);


        const fetchGhibli = async () => {
            elParent.innerHTML = '';
            elCurrentPage.innerHTML = page;

            const response = await fetch(" https://ghibliapi.vercel.app/films");
            const ghibli = await response.json();
            for (var i = ((page - 1) * perPage) + 0; i <= page * perPage; i++) {

                var id = ghibli[i].id;
                var name = ghibli[i].title;
                var details = ghibli[i].description;
                var image = ghibli[i].image;
                

                elParent.innerHTML += `
                <div class="row rounded-4 p-3" href="https://arkinetic-1.github.io/pedal-academic/Midterm/page.html">
                    <div class="col-2 d-flex justify-content-center align-items-center">
                        <img src="`+ image + `" class="img-fluid" style="max-width: 90%; max-height: auto;">
                    </div>

                    <div class="col-8 ms-3">
                        <h1 class="klontext text-white textshad">`+ name + `</h1>
                        <hr>
                        <p class="klontext text-white">`+ details + `</p>
                    </div>
                </div>
                `
            }

        };

        function prev() {
            page -= 1;
            if (page == 0) {
                page = finalPage;
            }
            fetchGhibli();
        }

        function next() {
            page += 1;
            if (page > finalPage) {
                page = 1;
            }
            fetchGhibli();
        }
        fetchGhibli();
    </script>
</body>

</html>
