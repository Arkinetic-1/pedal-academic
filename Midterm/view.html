<body>
    <!--Header-->
    <div class="container-fluid">
        <div class="row py-1 bg-head shadow textshad" style="height: 67px;">
            <nav class="navbar navbar-expand-sm bg-head shadow textshad rounded-4 d-flex">
                <div class="container-fluid">
                    <a class="navbar-brand orb text-white" href="https://arkinetic-1.github.io/index.html"
                        style="font-size: 30px;font-weight: bold;  ">
                        <img src="Assets/img/logo.svg" alt="Logo" class="image-fluid">&nbsp;
                        Arkinetic
                    </a>
                    <button class="navbar-toggler bg-white" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                        aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarNav">
                        <ul class="navbar-nav">
                            <li class="nav-item text-end orb">
                                <a class="nav-link text-light" href="https://arkinetic-1.github.io/academic.html">
                                    <h5>Academic</h5>
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </div>
    </div>


    <!--Body-->
    <div class="container-fluid mt-4 p-3">
        <h1 class="text-center textshad zen mt-1">The M.S.G. Database</h1>
        <div class="row p-1">

            <div class="col-12 d-flex justify-content-between align-items-center">
                <span class="h1 aud textshad"><u>GUNDAMS</u></span>
                <div class="p-1">
                    <ul class="pagination">
                        <li class="page-item aud"><a class="page-link" onclick="prev()">Previous</a></li>
                        <li class="page-item aud"><a class="page-link" id="currentpage">1</a></li>
                        <li class="page-item aud"><a class="page-link" onclick="next()">Next</a></li>
                    </ul>
                </div>
            </div>

            <div class="col-12 mt-3" id="parent">
                
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>
        //Init Elements
        var elCurrentPage = document.getElementById("currentpage");
        var elParent = document.getElementById("parent");
        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        var page = urlParams.get('page');
        if (page == null) {
            page = 1;
        } else {
            page = parseInt(page);
        }

        //Pagination Variables
        var lastGundam = 15
        var perPage = 5
        var finalPage = Math.ceil(lastGundam / perPage);

        // const response = await fetch('https://gundam-api.pages.dev/gundams/api-gundams')
        const fetchGundam = async () => {
            elParent.innerHTML = '';
            elCurrentPage.innerHTML = page;

            for (var i = ((page - 1) * perPage) + 1; i <= page * perPage; i++) {

                const response = await fetch("https://gundam-api.pages.dev/api/gundams");
                const gundam = await response.json();

                var id = gundam.id;
                var name = gundam.name;
                var details = gundam.header;

                elParent.innerHTML += `
                <div class="card bg-secondary shad rounded-4">
                    <div class="card-body p-3">
                        <h1 class="aud text-white textshad">`+name+`</h1>
                        <hr>
                        <p class="zen text-white">`+details+`</p>
                    </div>
                </div>
                `
            }
            
        };

        fetchGundam();
    </script>
</body>

</html>
